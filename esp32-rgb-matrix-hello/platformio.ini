; Waveshare ESP32-S3-RGB-Matrix hello-world demo.
[env:waveshare_esp32_s3_rgb_matrix]
; The current Arduino-ESP32 release is used with a browser-based local updater.
; It avoids the unreliable UDP discovery/transport used by ArduinoOTA on this board.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The installed Waveshare boards identify as 8 MB OPI-flash ESP32-S3s.
; Keep two 3.1875 MB application slots: enough for Matter and still safe for
; verified OTA updates after the initial USB installation.
board_build.flash_size = 8MB
; This Waveshare S3 has QIO flash plus 16 MB OPI PSRAM. The generic N8 board
; profile otherwise builds as "no PSRAM", leaving Matter and the full-colour
; HUB75 framebuffer to fight over 320 KB of internal RAM.
board_build.memory_type = qio_opi
; Matter needs a substantially larger application image than the old 1.25 MB
; OTA slots. default_8MB provides two 3.1875 MB application slots.
board_build.partitions = default_8MB.csv
extra_scripts = pre:tools/release_version.py

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  ; Use the real OPI PSRAM for the HUB75 DMA framebuffer. This keeps the
  ; original 8-bit colour palette while freeing internal RAM for Matter.
  -D SPIRAM_DMA_BUFFER

lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SHTC3 Library@^1.0.1
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  ricmoo/QRCode@^0.0.1

; Select this environment in PlatformIO after Wi-Fi provisioning. It posts the
; built firmware to the board's local update page rather than using USB.
[env:waveshare_esp32_s3_rgb_matrix_ota]
extends = env:waveshare_esp32_s3_rgb_matrix
upload_protocol = custom
; DHCP currently assigned the board this address. Change it if your router gives
; the board a different lease, or reserve this IP in the router.
upload_command = curl --fail --form "update=@$SOURCE" http://10.0.0.25/update
