; Waveshare ESP32-S3-RGB-Matrix hello-world demo.
[env:waveshare_esp32_s3_rgb_matrix]
; The current Arduino-ESP32 release is used with a browser-based local updater.
; It avoids the unreliable UDP discovery/transport used by ArduinoOTA on this board.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-N32R16: 32 MB flash and 16 MB OPI PSRAM.
board_build.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
  adafruit/Adafruit GFX Library
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  ricmoo/QRCode@^0.0.1

; Select this environment in PlatformIO after Wi-Fi provisioning. It posts the
; built firmware to the board's local update page rather than using USB.
[env:waveshare_esp32_s3_rgb_matrix_ota]
extends = env:waveshare_esp32_s3_rgb_matrix
upload_protocol = custom
; DHCP currently assigned the board this address. Change it if your router gives
; the board a different lease, or reserve this IP in the router.
upload_command = curl --fail --form "update=@$SOURCE" http://10.0.0.25/update
