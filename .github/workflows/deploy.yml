name: Release and deploy Winglet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options: [stable, preview]

# The workflow token creates immutable release assets. Cloudflare credentials
# remain repository secrets and are never embedded in the firmware.
permissions:
  contents: write

concurrency:
  group: plane-display-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  firmware-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      url: ${{ steps.release.outputs.url }}
      sha256: ${{ steps.release.outputs.sha256 }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build versioned firmware
        working-directory: esp32-rgb-matrix-hello
        env:
          PLANE_DISPLAY_RELEASE_VERSION: ${{ github.run_number }}
        run: |
          python -m pip install --upgrade platformio
          pio run -e waveshare_esp32_s3_rgb_matrix_ota
          cp .pio/build/waveshare_esp32_s3_rgb_matrix_ota/firmware.bin firmware.bin
          sha256sum firmware.bin > firmware.bin.sha256
      - name: Publish immutable GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        working-directory: esp32-rgb-matrix-hello
        run: |
          tag="firmware-${VERSION}"
          if [ "$CHANNEL" = "preview" ]; then tag="firmware-preview-${VERSION}"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" firmware.bin firmware.bin.sha256 --clobber
          else
            gh release create "$tag" firmware.bin firmware.bin.sha256 --title "Firmware ${VERSION} (${CHANNEL})" --notes "Automated ${CHANNEL} firmware release for commit ${GITHUB_SHA}."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${REPOSITORY}/releases/download/${tag}/firmware.bin" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f1 firmware.bin.sha256)" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: firmware-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: backend
        run: npm ci
      # wrangler-action treats every line in `command` as a Wrangler subcommand,
      # so conditional shell must live in a regular run step.
      - name: Publish verified release manifest and deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CHANNEL: ${{ needs.firmware-release.outputs.channel }}
          RELEASE_VERSION: ${{ needs.firmware-release.outputs.version }}
          RELEASE_URL: ${{ needs.firmware-release.outputs.url }}
          RELEASE_SHA256: ${{ needs.firmware-release.outputs.sha256 }}
        run: |
          npx --yes wrangler@4 d1 migrations apply plane-display --remote
          if [ "$RELEASE_CHANNEL" = 'preview' ]; then
            printf %s "$RELEASE_VERSION" | npx --yes wrangler@4 secret put FIRMWARE_PREVIEW_VERSION
            printf %s "$RELEASE_URL" | npx --yes wrangler@4 secret put FIRMWARE_PREVIEW_URL
            printf %s "$RELEASE_SHA256" | npx --yes wrangler@4 secret put FIRMWARE_PREVIEW_SHA256
          else
            printf %s "$RELEASE_VERSION" | npx --yes wrangler@4 secret put FIRMWARE_RELEASE_VERSION
            printf %s "$RELEASE_URL" | npx --yes wrangler@4 secret put FIRMWARE_RELEASE_URL
            printf %s "$RELEASE_SHA256" | npx --yes wrangler@4 secret put FIRMWARE_RELEASE_SHA256
          fi
          npx --yes wrangler@4 deploy
