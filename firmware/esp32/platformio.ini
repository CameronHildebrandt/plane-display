; VS Code / PlatformIO project for the flight-display controller.
; This is a generic ESP32-S3 target. Replace `board` only after confirming the
; exact Waveshare product identifier from its product page or board silkscreen.
[platformio]
src_dir = .
include_dir = ../include

[env:waveshare_esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git

